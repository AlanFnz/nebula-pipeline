name: commit messages
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  subjects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: check new commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/check_commit_message.py --range "$BASE_SHA..$HEAD_SHA"
